name: Advanced Commit Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Fetch all repos commits via GitHub API
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -H "Authorization: token $TOKEN" \
          https://api.github.com/users/Vishal-047/events \
          > events.json

      - name: Extract commit dates
        run: |
          cat events.json | jq -r '.[] | select(.type=="PushEvent") | .created_at' | cut -d'T' -f1 > dates.txt

      - name: Calculate top 5 days
        run: |
          sort dates.txt | uniq -c | sort -rn | head -5 > top_days.txt

      - name: Format output
        run: |
          echo "## 📅 Top Commit Days" > output.txt
          echo "" >> output.txt
          awk '{print "- "$2" → "$1" commits"}' top_days.txt >> output.txt

      - name: Inject into README
        run: |
          CONTENT=$(cat output.txt)

          awk '
          /<!-- START_STATS -->/ {print; print ENVIRON["CONTENT"]; skip=1; next}
          /<!-- END_STATS -->/ {skip=0}
          !skip
          ' README.md > temp.md

          mv temp.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add README.md
          git commit -m "Update advanced commit stats" || echo "No changes"
          git push
